# Unit tests, lint (luacheck) and type check (lua-language-server, tools/check_types.sh).
# Runs on every push and pull request, and before each deploy (pages.yml calls it).
name: Check

on:
  push:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit tests/run.lua

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua-check
      - run: luacheck .

  luals:
    runs-on: ubuntu-latest
    env:
      LUALS_VERSION: 3.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Install lua-language-server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/luals"
          echo "LUALS=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"
      - run: tools/check_types.sh

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>love-mcraft</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10141a;
      color: #c8d2dc;
      font: 14px/1.4 system-ui, sans-serif;
      overflow: hidden;
    }
    main {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The game renders at its conf.lua size; CSS scales it to fit the window. */
    #canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #87bff2;
      visibility: hidden;
      /* Touches drive the game; don't let the browser scroll, zoom or select. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      opacity: 0.7;
      pointer-events: none;
      transition: opacity 1s;
    }
    #rotate {
      display: none;
    }
    /* The game is 16:9; on a phone held upright it would be a thin strip. */
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate {
        display: flex;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #10141a;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </main>
  <div id="status">Downloading…</div>
  <div id="hint">Click to capture the mouse · WASD + Space/Shift to fly · Left click break · Right click place · Esc releases the mouse · Tab or the top-right button: touch controls</div>
  <div id="rotate">Rotate your device to landscape</div>

  <script>
    var statusElement = document.getElementById("status");
    var canvas = document.getElementById("canvas");
    // Touch-first devices (phones, tablets) start with the on-screen controls.
    // The button in the top-right corner switches between touch and
    // mouse/keyboard controls on any device.
    var startWithTouch = window.matchMedia("(pointer: coarse)").matches;
    if (startWithTouch) {
      document.getElementById("hint").textContent =
        "Left side: move · Right side: look · Buttons: fly up/down, break, place · Top-right: mouse & keyboard";
    }

    // Keep keys the game uses from scrolling the page or moving focus (Tab).
    window.addEventListener("keydown", function (e) {
      if ([" ", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    });
    window.addEventListener("click", function () { window.focus(); });
    setTimeout(function () { document.getElementById("hint").style.opacity = 0; }, 10000);

    canvas.addEventListener("webglcontextlost", function (e) {
      statusElement.textContent = "The WebGL context was lost. Reload the page to continue.";
      e.preventDefault();
    });

    var Module = {
      arguments: startWithTouch ? ["./game.love", "--touch"] : ["./game.love"],
      INITIAL_MEMORY: {{memory}},
      canvas: canvas,
      printErr: console.error.bind(console),
      totalDependencies: 0,
      remainingDependencies: 0,
      setStatus: function (text) {
        if (text) {
          statusElement.textContent = text;
        } else if (Module.remainingDependencies === 0) {
          statusElement.style.display = "none";
          canvas.style.visibility = "visible";
        }
      },
      monitorRunDependencies: function (left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? "Loading… (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")"
          : "");
      }
    };

    window.onerror = function () {
      statusElement.style.display = "flex";
      statusElement.textContent = "Something went wrong — see the browser console for details.";
    };
  </script>
  <script src="game.js"></script>
  <script async src="love.js" onload="Love(Module)"></script>
</body>
</html>

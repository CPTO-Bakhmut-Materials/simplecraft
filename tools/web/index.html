<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>love-mcraft</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10141a;
      color: #c8d2dc;
      font: 14px/1.4 system-ui, sans-serif;
      overflow: hidden;
    }
    main {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The game renders at its conf.lua size; CSS scales it to fit the window. */
    #canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #87bff2;
      visibility: hidden;
      /* Touches drive the game; don't let the browser scroll, zoom or select. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      opacity: 0.7;
      pointer-events: none;
      transition: opacity 1s;
    }
    /* Fullscreen button for touch devices (they have no G key); shown by the script below. */
    #fullscreen {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      padding: 10px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      touch-action: manipulation;
    }
    #fullscreen svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    #fullscreen .exit, #fullscreen.active .enter {
      display: none;
    }
    #fullscreen.active .exit {
      display: block;
    }
    #rotate {
      display: none;
    }
    /* The game is 16:9; on a phone held upright it would be a thin strip. */
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate {
        display: flex;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #10141a;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </main>
  <div id="status">Downloading…</div>
  <div id="hint">Click to capture the mouse · WASD + Space/Shift to fly · Left click break · Right click place · Esc releases the mouse · G toggles fullscreen</div>
  <button id="fullscreen" type="button" aria-label="Toggle fullscreen">
    <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>
    </svg>
    <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>
    </svg>
  </button>
  <div id="rotate">Rotate your device to landscape</div>

  <script>
    var statusElement = document.getElementById("status");
    var canvas = document.getElementById("canvas");
    // Phones and tablets (touch-first devices) use the on-screen controls;
    // everything else uses mouse & keyboard.
    var touchDevice = window.matchMedia("(pointer: coarse)").matches;
    if (touchDevice) {
      document.getElementById("hint").textContent =
        "Left side: move · Right side: look · Buttons: fly up/down, break, place · Top-right: fullscreen";
    }

    // Keep keys the game uses from scrolling the page.
    window.addEventListener("keydown", function (e) {
      if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    });
    // Fullscreen: the G key (keys.fullscreen in src/config.lua) and, on touch
    // devices, the button. The page does it, not the game: the browser's own
    // fullscreen of the whole page keeps the canvas CSS above in charge, so the
    // game stays 16:9 and letterboxed. Safari on iPad only has the prefixed API;
    // Safari on iPhone has none, so the button stays hidden there.
    var root = document.documentElement;
    var fullscreenSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    function fullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }
    function toggleFullscreen() {
      if (fullscreenElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var request = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        if (request) {
          request.catch(function () {});
        }
      }
    }
    window.addEventListener("keydown", function (e) {
      if (fullscreenSupported && e.key.toLowerCase() === "g" && !e.repeat) {
        toggleFullscreen();
      }
    });
    var fullscreenButton = document.getElementById("fullscreen");
    if (touchDevice && fullscreenSupported) {
      fullscreenButton.style.display = "block";
      fullscreenButton.addEventListener("click", toggleFullscreen);
      ["fullscreenchange", "webkitfullscreenchange"].forEach(function (name) {
        document.addEventListener(name, function () {
          fullscreenButton.classList.toggle("active", !!fullscreenElement());
        });
      });
    }
    window.addEventListener("click", function () { window.focus(); });
    setTimeout(function () { document.getElementById("hint").style.opacity = 0; }, 10000);

    canvas.addEventListener("webglcontextlost", function (e) {
      statusElement.textContent = "The WebGL context was lost. Reload the page to continue.";
      e.preventDefault();
    });

    var Module = {
      arguments: touchDevice ? ["./game.love", "--touch"] : ["./game.love"],
      INITIAL_MEMORY: {{memory}},
      canvas: canvas,
      printErr: console.error.bind(console),
      totalDependencies: 0,
      remainingDependencies: 0,
      setStatus: function (text) {
        if (text) {
          statusElement.textContent = text;
        } else if (Module.remainingDependencies === 0) {
          statusElement.style.display = "none";
          canvas.style.visibility = "visible";
        }
      },
      monitorRunDependencies: function (left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? "Loading… (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")"
          : "");
      }
    };

    window.onerror = function () {
      statusElement.style.display = "flex";
      statusElement.textContent = "Something went wrong — see the browser console for details.";
    };
  </script>
  <script src="game.js"></script>
  <script async src="love.js" onload="Love(Module)"></script>
</body>
</html>
